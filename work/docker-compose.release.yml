# =============================================================================
# media-ingest —— docker-compose.release.yml（镜像部署，推荐）
# =============================================================================
# 用预构建镜像直接跑：不需要源码、不需要本地构建、不需要改 .env。
# 三步（在放本文件的目录里执行）：
#     docker compose -f docker-compose.release.yml pull
#     docker compose -f docker-compose.release.yml up -d
#     docker compose -f docker-compose.release.yml ps     # 出现 (healthy) 即成功
# 然后浏览器打开 http://<本机 IP>:18081 建管理员、建媒体库。
#
# 想按自己的环境调整，任选一种：
#   a) 直接改下面 environment / volumes 里的默认值；
#   b) 在同目录放 .env（compose 会自动读取，可 `cp .env.example .env` 改 PUID/PGID/MEDIA_ROOT），
#      或用环境变量临时覆盖，例如：
#        MEDIA_ROOT=/mnt/media MLM_DATA_DIR=/mnt/media/docker/media-ingest/data \
#          docker compose -f docker-compose.release.yml up -d
#
# 部署前必读：**下载目录与媒体库必须落在同一个挂载里**（硬链接不能跨挂载）。
# 所以这里只挂一条"共同父目录"，且容器内路径 = 宿主路径：
#     - ${MEDIA_ROOT:-/vol1/1000}:${MEDIA_ROOT:-/vol1/1000}
# ⚠️ 不要拆成 /downloads、/library 两条 bind：那样硬链接必然失败（EXDEV）。
# ⚠️ MEDIA_ROOT 必须是宿主上**真实存在**的目录，否则 Docker 会以 root 新建空目录。
# ⚠️ 数据卷（MLM_DATA_DIR）与媒体目录需要在同一个文件系统上（通常都在 /vol1 下）。
#
# 版本：默认钉住 1.0.0；要跟随最新发布设 MLM_VERSION=latest。
# 镜像在 GHCR（GitHub Container Registry），多架构（linux/amd64、linux/arm64）：
#     ghcr.io/taro-clo/media-ingest:1.0.0
# =============================================================================

name: media-ingest

services:
  media-ingest:
    image: "ghcr.io/taro-clo/media-ingest:${MLM_VERSION:-1.0.0}"
    container_name: media-ingest

    # 单进程运行：硬链接日志是"读-改-写整份"，多 worker 会互相覆盖。
    restart: unless-stopped

    environment:
      # 运行身份：容器内进程的 uid/gid，须能读下载源、能写媒体库。
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1001}"
      # 时区与字符集（写中文日志依赖 UTF-8 locale，不要改成 C/POSIX）。
      TZ: "${TZ:-Asia/Shanghai}"
      LANG: "C.UTF-8"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # 数据目录（容器内）：SQLite、任务日志、库日志、secret.key、config。
      DATA_DIR: "/data"
      CONFIG_DIR: "/data/config"
      # 首次建库时"允许的源/目标根目录"的初值；只用于 DB 首次播种。
      # ⚠️ 如果改了 MEDIA_ROOT，这两个也要跟着改成新路径下的 Download / Library。
      # 已部署实例请在 WebUI「设置」页修改（改环境变量不生效）。
      DEFAULT_SOURCE_ROOT: "${DEFAULT_SOURCE_ROOT:-/vol1/1000/Download}"
      DEFAULT_TARGET_ROOT: "${DEFAULT_TARGET_ROOT:-/vol1/1000/Library}"
      # 容器内监听端口；必须与下面 ports 的容器侧一致，故两者用同一个表达式。
      PORT: "${PORT:-18081}"
      # 媒体共同父挂载的容器内路径（与 volumes 第一条同一个表达式）。
      MEDIA_ROOT: "${MEDIA_ROOT:-/vol1/1000}"
      # 可选：会话签名密钥（留空 → 首次启动生成到 /data/secret.key）。
      SECRET_KEY: "${SECRET_KEY:-}"
      # 可选：首次启动自动创建管理员（都留空 → 首次打开 WebUI 时引导创建）。
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # HOST_PATH_MAP 故意不设：单挂载形态下容器路径 = 宿主路径，
      # 空映射（应用默认）就是恒等换算。只有旧式 /downloads + /library 双 bind
      # 部署才需要显式给 JSON 映射。

    ports:
      # 宿主端口 : 容器端口，两侧都取 ${PORT:-18081}，改端口只需改一处。
      - "${PORT:-18081}:${PORT:-18081}"

    volumes:
      # 1. 媒体：**单一共同父挂载**（硬链接可用的前提）。容器内路径 = 宿主路径。
      - "${MEDIA_ROOT:-/vol1/1000}:${MEDIA_ROOT:-/vol1/1000}"
      # 2. 应用数据：可写持久化（SQLite、日志、secret.key、config）。宿主目录需已存在。
      - "${MLM_DATA_DIR:-/vol1/1000/Docker/media-ingest/data}:/data"

    # 健康检查沿用镜像 Dockerfile 里那一条（六项 checks 的解析也在镜像里）。

    # 日志轮转：避免长期运行把磁盘写满。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
