# =============================================================================
# media-ingest —— docker-compose.yml（仓库内模板）
# =============================================================================
# 快速开始（详见 docs/guides/DEPLOYMENT.md）：
#     cp .env.example .env          # 按需修改 PUID/PGID/MEDIA_ROOT 等
#     docker compose up -d
#     docker compose ps             # STATUS 出现 (healthy) 即成功
#
# 部署前必读：**源目录与媒体库必须落在同一个挂载里**（硬链接不能跨挂载）。
# 因此这里只挂一条"共同父目录"，且容器内路径 = 宿主路径：
#     - ${MEDIA_ROOT:-/vol1/1000}:${MEDIA_ROOT:-/vol1/1000}
# 源与目标都是它的子路径（如 /vol1/1000/Download、/vol1/1000/Library）。
# ⚠️ 不要拆成 /downloads、/library 两条 bind：那样硬链接必然失败（EXDEV）。
# ⚠️ MEDIA_ROOT 必须是宿主上真实存在的目录，否则 Docker 会以 root 新建空目录。
#
# .env 只被 docker compose 用于 ${VAR} 插值，应用代码不读它；容器内真正生效的
# 环境变量是下面 environment: 段里逐条写出的值。
# =============================================================================

name: media-ingest

services:
  media-ingest:
    build:
      # 构建上下文是仓库根（Dockerfile 需要同时看到 app/ 与 web/）
      context: .
      dockerfile: docker/Dockerfile
    image: media-ingest:latest
    container_name: media-ingest

    # 单进程运行：硬链接日志是"读-改-写整份"，多 worker 会互相覆盖。
    # 请勿开 replicas，也不要给 uvicorn 加 --workers。
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # 运行身份：容器内进程的 uid/gid，须能读下载源、能写媒体库。
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1001}"
      # 时区与字符集（写中文日志依赖 UTF-8 locale，不要改成 C/POSIX）。
      TZ: "${TZ:-Asia/Shanghai}"
      LANG: "C.UTF-8"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # 数据目录（容器内）：SQLite、任务日志、库日志、secret.key、config。
      DATA_DIR: "/data"
      # 配置文件镜像目录（在 /data 卷内，无需单独挂载）。
      CONFIG_DIR: "${CONFIG_DIR:-/data/config}"
      # 首次建库时"允许的源/目标根目录"的初值；只用于 DB 首次播种，
      # 已部署实例请在 WebUI「设置」页修改（改环境变量不生效）。
      DEFAULT_SOURCE_ROOT: "${DEFAULT_SOURCE_ROOT:-/vol1/1000/Download}"
      DEFAULT_TARGET_ROOT: "${DEFAULT_TARGET_ROOT:-/vol1/1000/Library}"
      # 容器内监听端口；必须与下面 ports 的容器侧一致，故两者用同一个表达式。
      PORT: "${PORT:-18081}"
      # 容器路径 -> 宿主路径映射（JSON；容器路径 = 宿主路径时为恒等映射）。
      HOST_PATH_MAP: '${HOST_PATH_MAP:-{"/vol1/1000":"/vol1/1000"}}'
      # 媒体共同父挂载的容器内路径（与 volumes 第一条同一个表达式）。
      # entrypoint 用它做启动前结构检查（例如它与 DATA_DIR 不能在同一挂载里）。
      MEDIA_ROOT: "${MEDIA_ROOT:-/vol1/1000}"
      # 可选：会话签名密钥（留空 → 首次启动生成到 /data/secret.key）。
      SECRET_KEY: "${SECRET_KEY:-}"
      # 可选：首次启动自动创建管理员（都留空 → 首次打开 WebUI 时引导创建）。
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

    ports:
      # 宿主端口 : 容器端口，两侧都取 ${PORT:-18081}，改端口只需改 .env 一处。
      - "${PORT:-18081}:${PORT:-18081}"

    volumes:
      # 1. 媒体：**单一共同父挂载**（硬链接可用的前提）。容器内路径 = 宿主路径。
      - "${MEDIA_ROOT:-/vol1/1000}:${MEDIA_ROOT:-/vol1/1000}"
      # 2. 应用数据：可写持久化（SQLite、日志、secret.key、config）。宿主目录需已存在。
      - "${MLM_DATA_DIR:-/vol1/1000/Docker/media-ingest/data}:/data"

    # 健康检查沿用镜像 Dockerfile 里那一条（真生效的是它，含六项 checks 的解析），
    # 这里不重复声明以免端口/参数错位。临时调整探针参数时再覆写，见 DEPLOYMENT.md。

    # 日志轮转：避免长期运行把磁盘写满。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
